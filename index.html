:root{
  --bg:#f3f4f8; --surface:#ffffff; --fg:#1d1b26; --muted:#7a7789; --line:#dddbe6;
  --accent:#5b3a8c; --accent-fg:#ffffff; --chip-off:#ebeaf0;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#15141b; --surface:#1f1d29; --fg:#ecebf3; --muted:#9a97ab; --line:#33303f;

body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-size:1.25rem;margin:0 0 10px;letter-spacing:.02em}
#q{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
#q:focus-visible,a:focus-visible,.jump a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jump{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.jump a{flex:none;font-size:.8rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;margin-right:8px}
.jump a:hover{color:var(--accent);border-color:var(--accent)}
section{padding-block:24px 4px;scroll-margin-top:120px}
h2{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 small{font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
h3{font-size:.85rem;font-weight:500;color:var(--muted);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:0;font-size:.9rem;padding:7px 12px;border-radius:999px;text-decoration:none;overflow-wrap:anywhere}
a.chip{background:var(--accent);color:var(--accent-fg);font-weight:500;display:inline-flex;align-items:center;gap:6px}
a.chip i{font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.05em;opacity:.8;border:1px solid currentColor;border-radius:4px;padding:0 4px}
a.chip:hover{filter:brightness(1.1)}
span.chip{background:var(--chip-off);color:var(--muted)}
.note{color:var(--muted);font-size:.8rem;margin:10px 0 0}
#empty{color:var(--muted);padding-block:32px;text-align:center}
</style>
<style>
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tabs button{flex:1;font:inherit;font-weight:500;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jump button{flex:none;font:inherit;font-size:.8rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:4px 0;margin-right:8px;cursor:pointer}
.jump button:hover{color:var(--accent);border-color:var(--accent)}
:root[data-tab="vg"]{--accent:#0f766e;--accent-fg:#ffffff}
@media (prefers-color-scheme:dark){:root[data-tab="vg"]:not([data-theme="light"]){--accent:#5eead4;--accent-fg:#053b36}}
:root[data-theme="dark"][data-tab="vg"]{--accent:#5eead4;--accent-fg:#053b36}
header.top{border-bottom:2px solid var(--accent)}
h2{color:var(--accent)}</style></head><body>

    var sec=document.createElement("section");sec.id=tab+"-"+s.id;
    var h=document.createElement("h2");h.textContent=s.title;var c=document.createElement("small");h.appendChild(c);sec.appendChild(h);
    s.groups.forEach(function(g){
      if(g.sub){var h3=document.createElement("h3");h3.textContent="+ "+g.sub;sec.appendChild(h3)}
      var box=document.createElement("div");box.className="chips";
      g.items.forEach(function(it){box.appendChild(chip(it[0],it[1]))});
      sec.appendChild(box);
    });
    list.appendChild(sec);
    var b=document.createElement("button");b.type="button";b.textContent=s.title;
    b.addEventListener("click",function(){sec.scrollIntoView({behavior:"smooth",block:"start"})});
    jump.appendChild(b);
  });
  count();
  try{localStorage.setItem("partnersTab",tab)}catch(e){}
}
function count(){
  var t=q.value.trim().toLowerCase(),any=false;
  DATA[cur].forEach(function(s){
    var sec=document.getElementById(cur+"-"+s.id),n=0;
    sec.querySelectorAll(".chip").forEach(function(c){var ok=!t||c.dataset.n.indexOf(t)>-1;c.hidden=!ok;if(ok)n++});
    sec.querySelectorAll("h3").forEach(function(h){var box=h.nextElementSibling;h.hidden=!box.querySelector(".chip:not([hidden])")});
    sec.hidden=n===0;sec.querySelector("small").textContent=n+"곳";if(n)any=true;
  });
  empty.hidden=any;
}
document.getElementById("tab-le").addEventListener("click",function(){render("le")});
document.getElementById("tab-vg").addEventListener("click",function(){render("vg")});
q.addEventListener("input",count);
var start="le";try{var sv=localStorage.getItem("partnersTab");if(sv==="le"||sv==="vg")start=sv}catch(e){}
render(start);
</script>
</body></html>
